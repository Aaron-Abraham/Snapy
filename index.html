<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SNAPY — Neon Snake</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --neon-green:#00ff88;
    --neon-cyan:#00e5ff;
    --neon-pink:#ff2d78;
    --neon-gold:#ffd700;
    --bg:#050a0f;
    --panel:#0a1520;
    --border:#1a3a5c;
  }
  body{
    background:var(--bg);
    color:#fff;
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  body::before{
    content:'';
    position:fixed;inset:0;
    background:radial-gradient(ellipse at 20% 20%, #00ff8811 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, #ff2d7811 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, #00e5ff08 0%, transparent 70%);
    pointer-events:none;
  }
  h1{
    font-family:'Orbitron',monospace;
    font-size:2.4rem;
    font-weight:900;
    letter-spacing:0.2em;
    background:linear-gradient(90deg,var(--neon-green),var(--neon-cyan),var(--neon-pink));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    text-shadow:none;
    margin-bottom:6px;
    animation:titlePulse 3s ease-in-out infinite;
  }
  @keyframes titlePulse{
    0%,100%{filter:brightness(1)}
    50%{filter:brightness(1.3)}
  }
  .subtitle{
    font-size:0.75rem;
    letter-spacing:0.3em;
    color:#4a7a9b;
    text-transform:uppercase;
    margin-bottom:20px;
  }
  .game-wrapper{
    display:flex;
    gap:20px;
    align-items:flex-start;
  }
  .side-panel{
    width:160px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--neon-cyan),transparent);
  }
  .card-label{
    font-size:0.6rem;
    letter-spacing:0.25em;
    color:#4a7a9b;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .card-value{
    font-family:'Orbitron',monospace;
    font-size:1.8rem;
    font-weight:700;
    color:var(--neon-cyan);
    text-shadow:0 0 20px var(--neon-cyan);
  }
  .card-value.green{color:var(--neon-green);text-shadow:0 0 20px var(--neon-green)}
  .card-value.gold{color:var(--neon-gold);text-shadow:0 0 20px var(--neon-gold)}
  .scoreboard{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    position:relative;overflow:hidden;
  }
  .scoreboard::before{
    content:'';
    position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--neon-pink),transparent);
  }
  .scoreboard h3{
    font-family:'Orbitron',monospace;
    font-size:0.65rem;
    letter-spacing:0.2em;
    color:var(--neon-pink);
    text-transform:uppercase;
    margin-bottom:12px;
    text-shadow:0 0 10px var(--neon-pink);
  }
  .score-entry{
    display:flex;
    align-items:center;
    gap:8px;
    padding:5px 0;
    border-bottom:1px solid #0d2035;
    font-size:0.75rem;
  }
  .score-entry:last-child{border-bottom:none}
  .rank{
    font-family:'Orbitron',monospace;
    font-size:0.6rem;
    color:#4a7a9b;
    width:18px;
  }
  .score-name{flex:1;color:#8ab4cc}
  .score-pts{
    font-family:'Orbitron',monospace;
    font-size:0.75rem;
    color:var(--neon-gold);
  }
  .canvas-container{
    position:relative;
  }
  canvas{
    display:block;
    border-radius:12px;
    border:1px solid var(--border);
    box-shadow:0 0 40px #00e5ff18, 0 0 80px #00ff8810, inset 0 0 40px #00000080;
  }
  .overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:rgba(5,10,15,0.88);
    border-radius:12px;
    backdrop-filter:blur(6px);
    transition:opacity 0.3s;
  }
  .overlay.hidden{opacity:0;pointer-events:none}
  .overlay-title{
    font-family:'Orbitron',monospace;
    font-size:2rem;
    font-weight:900;
    margin-bottom:8px;
  }
  .overlay-title.game-over{
    color:var(--neon-pink);
    text-shadow:0 0 30px var(--neon-pink);
    animation:glitch 0.5s infinite;
  }
  @keyframes glitch{
    0%,100%{transform:translate(0)}
    20%{transform:translate(-2px,1px)}
    40%{transform:translate(2px,-1px)}
    60%{transform:translate(-1px,2px)}
    80%{transform:translate(1px,-2px)}
  }
  .overlay-title.start{
    color:var(--neon-green);
    text-shadow:0 0 30px var(--neon-green);
  }
  .overlay-score{
    font-family:'Orbitron',monospace;
    font-size:1.1rem;
    color:var(--neon-cyan);
    margin-bottom:30px;
  }
  .btn{
    font-family:'Orbitron',monospace;
    font-size:0.85rem;
    font-weight:700;
    letter-spacing:0.15em;
    padding:14px 36px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:linear-gradient(135deg,var(--neon-green),var(--neon-cyan));
    color:#050a0f;
    text-transform:uppercase;
    transition:all 0.2s;
    box-shadow:0 0 20px #00ff8850;
  }
  .btn:hover{
    transform:scale(1.06);
    box-shadow:0 0 35px #00ff8880;
  }
  .btn:active{transform:scale(0.97)}
  .hint{
    margin-top:18px;
    font-size:0.65rem;
    letter-spacing:0.2em;
    color:#2a5a7c;
    text-transform:uppercase;
  }
  .speed-bar{
    height:4px;
    border-radius:2px;
    background:#0d2035;
    margin-top:8px;
    overflow:hidden;
  }
  .speed-fill{
    height:100%;
    border-radius:2px;
    background:linear-gradient(90deg,var(--neon-green),var(--neon-cyan));
    transition:width 0.3s;
    box-shadow:0 0 6px var(--neon-cyan);
  }
  @media(max-width:700px){
    .game-wrapper{flex-direction:column;align-items:center}
    .side-panel{flex-direction:row;width:auto;flex-wrap:wrap;justify-content:center}
    .card{min-width:120px}
    h1{font-size:1.6rem}
  }
</style>
</head>
<body>
<h1>SNAPY</h1>
<p class="subtitle">Neon Snake &mdash; Infinite Mode</p>

<div class="game-wrapper">
  <!-- Left Panel -->
  <div class="side-panel">
    <div class="card">
      <div class="card-label">Score</div>
      <div class="card-value green" id="score">0</div>
    </div>
    <div class="card">
      <div class="card-label">Best</div>
      <div class="card-value gold" id="best">0</div>
    </div>
    <div class="card">
      <div class="card-label">Length</div>
      <div class="card-value" id="length">1</div>
    </div>
    <div class="card">
      <div class="card-label">Speed</div>
      <div class="card-value" id="speed-val" style="font-size:1.2rem;color:#8ab4cc">1x</div>
      <div class="speed-bar"><div class="speed-fill" id="speed-fill" style="width:10%"></div></div>
    </div>
  </div>

  <!-- Canvas -->
  <div class="canvas-container">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-title start" id="overlay-title">SNAPY</div>
      <div class="overlay-score" id="overlay-score">Ready to play?</div>
      <button class="btn" id="startBtn">START GAME</button>
      <p class="hint">Arrow Keys or WASD to move</p>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="side-panel">
    <div class="scoreboard">
      <h3>🏆 Leaderboard</h3>
      <div id="leaderboard"></div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const COLS = 25, ROWS = 25;
const CELL = canvas.width / COLS;

// State
let snake, dir, nextDir, gem, gems, score, best, gameLoop, running, gemTypes;

// Load best from localStorage
best = parseInt(localStorage.getItem('snapy_best') || '0');
let leaderboard = JSON.parse(localStorage.getItem('snapy_lb') || '[]');

const GEM_TYPES = [
  { color: '#00ff88', glow: '#00ff88', pts: 10, label: 'EMERALD' },
  { color: '#00e5ff', glow: '#00e5ff', pts: 20, label: 'SAPPHIRE' },
  { color: '#ffd700', glow: '#ffd700', pts: 50, label: 'GOLD' },
  { color: '#ff2d78', glow: '#ff2d78', pts: 30, label: 'RUBY' },
];

function rnd(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function rndCell(){ return {x: rnd(1,COLS-2), y: rnd(1,ROWS-2)}; }

function spawnGem(){
  let pos;
  do { pos = rndCell(); }
  while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
  const type = GEM_TYPES[Math.random()<0.6?0:Math.random()<0.5?1:Math.random()<0.5?3:2];
  return {...pos, type, pulse:0, rotate:0};
}

function initGame(){
  const cx = Math.floor(COLS/2), cy = Math.floor(ROWS/2);
  snake = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  gems = [spawnGem()];
  score = 0;
  running = true;
  updateUI();
}

function getSpeed(){
  const lvl = Math.floor(score/100);
  return Math.min(lvl+1, 10);
}

function getInterval(){
  return Math.max(60, 140 - getSpeed()*8);
}

function updateUI(){
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('length').textContent = snake.length;
  const sp = getSpeed();
  document.getElementById('speed-val').textContent = sp+'x';
  document.getElementById('speed-fill').style.width = (sp*10)+'%';
}

// --- Drawing ---
function drawGrid(){
  ctx.save();
  ctx.strokeStyle = 'rgba(0,229,255,0.04)';
  ctx.lineWidth = 0.5;
  for(let x=0;x<=COLS;x++){
    ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,canvas.height); ctx.stroke();
  }
  for(let y=0;y<=ROWS;y++){
    ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(canvas.width,y*CELL); ctx.stroke();
  }
  ctx.restore();
}

function drawBg(){
  ctx.fillStyle = '#050a0f';
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawSnake(){
  const len = snake.length;
  snake.forEach((seg,i)=>{
    const t = i/len;
    const isHead = i===0;
    const alpha = 1 - t*0.35;
    const x = seg.x*CELL, y = seg.y*CELL;
    const pad = isHead ? 1 : 2;

    // Glow
    if(i<8){
      ctx.save();
      ctx.shadowBlur = isHead ? 28 : 14;
      ctx.shadowColor = `rgba(0,255,136,${alpha*0.8})`;
      ctx.fillStyle = `rgba(0,255,136,0)`;
      ctx.fillRect(x+pad,y+pad,CELL-pad*2,CELL-pad*2);
      ctx.restore();
    }

    // Body gradient per segment
    const r = Math.round(0 + t*20);
    const g = Math.round(255 - t*80);
    const b = Math.round(136 - t*20);
    ctx.save();
    ctx.shadowBlur = isHead ? 20 : 8;
    ctx.shadowColor = `rgb(${r},${g},${b})`;

    const grad = ctx.createLinearGradient(x,y,x+CELL,y+CELL);
    grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(1, `rgba(${Math.min(r+30,255)},${Math.max(g-30,0)},${Math.min(b+30,255)},${alpha*0.7})`);

    ctx.fillStyle = grad;
    const radius = isHead ? 6 : 4;
    ctx.beginPath();
    ctx.roundRect(x+pad, y+pad, CELL-pad*2, CELL-pad*2, radius);
    ctx.fill();
    ctx.restore();

    // Head eyes
    if(isHead){
      ctx.save();
      ctx.fillStyle = '#050a0f';
      const eyeSize = 3;
      let ex1,ey1,ex2,ey2;
      const cx2 = x+CELL/2, cy2 = y+CELL/2;
      if(dir.x===1){ex1=cx2+2;ey1=cy2-4;ex2=cx2+2;ey2=cy2+4;}
      else if(dir.x===-1){ex1=cx2-5;ey1=cy2-4;ex2=cx2-5;ey2=cy2+4;}
      else if(dir.y===1){ex1=cx2-4;ey1=cy2+2;ex2=cx2+4;ey2=cy2+2;}
      else{ex1=cx2-4;ey1=cy2-5;ex2=cx2+4;ey2=cy2-5;}
      ctx.beginPath();ctx.arc(ex1,ey1,eyeSize,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ex2,ey2,eyeSize,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#00ff88';
      ctx.beginPath();ctx.arc(ex1,ey1,1.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ex2,ey2,1.5,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  });
}

function drawGems(){
  gems.forEach(gem=>{
    gem.pulse = (gem.pulse||0)+0.08;
    gem.rotate = (gem.rotate||0)+0.05;
    const gx = gem.x*CELL+CELL/2;
    const gy = gem.y*CELL+CELL/2;
    const scale = 1+Math.sin(gem.pulse)*0.15;
    const r = CELL*0.35*scale;

    ctx.save();
    ctx.translate(gx,gy);
    ctx.rotate(gem.rotate);

    // Outer glow
    ctx.shadowBlur = 25;
    ctx.shadowColor = gem.type.glow;

    // Diamond shape
    ctx.beginPath();
    ctx.moveTo(0,-r);
    ctx.lineTo(r*0.6,0);
    ctx.lineTo(0,r);
    ctx.lineTo(-r*0.6,0);
    ctx.closePath();

    const grad = ctx.createRadialGradient(0,-r*0.3,0,0,0,r);
    grad.addColorStop(0,'#ffffff');
    grad.addColorStop(0.3, gem.type.color);
    grad.addColorStop(1, gem.type.glow+'88');
    ctx.fillStyle = grad;
    ctx.fill();

    // Shine
    ctx.beginPath();
    ctx.moveTo(-r*0.15,-r*0.7);
    ctx.lineTo(r*0.15,-r*0.7);
    ctx.lineTo(0,-r*0.2);
    ctx.closePath();
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fill();

    // Point label
    ctx.restore();
    ctx.save();
    ctx.font = `bold ${CELL*0.28}px Orbitron, monospace`;
    ctx.fillStyle = gem.type.color;
    ctx.textAlign = 'center';
    ctx.shadowBlur = 8;
    ctx.shadowColor = gem.type.glow;
    ctx.fillText('+'+gem.type.pts, gx, gy+r+12);
    ctx.restore();
  });
}

// Floating score particles
let particles = [];
function addParticle(x,y,text,color){
  particles.push({x,y,text,color,life:1,vy:-1.5});
}
function drawParticles(){
  particles = particles.filter(p=>{
    p.life -= 0.025;
    p.y += p.vy;
    if(p.life<=0) return false;
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.font = `bold 14px Orbitron, monospace`;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = p.color;
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
    return true;
  });
}

let lastTime=0, accum=0;
function gameStep(ts){
  if(!running) return;
  const dt = ts - lastTime; lastTime=ts;
  accum += dt;
  const interval = getInterval();

  // Redraw every frame for particles/animations
  drawBg();
  drawGrid();
  drawSnake();
  drawGems();
  drawParticles();

  if(accum >= interval){
    accum = 0;
    dir = {...nextDir};
    const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};

    // Wall wrap
    head.x = (head.x+COLS)%COLS;
    head.y = (head.y+ROWS)%ROWS;

    // Self collision
    if(snake.some(s=>s.x===head.x&&s.y===head.y)){
      endGame(); return;
    }

    snake.unshift(head);

    // Gem eating
    const eatenIdx = gems.findIndex(g=>g.x===head.x&&g.y===head.y);
    if(eatenIdx!==-1){
      const eaten = gems[eatenIdx];
      score += eaten.type.pts;
      addParticle(head.x*CELL+CELL/2, head.y*CELL, '+'+eaten.type.pts, eaten.type.color);
      gems.splice(eatenIdx,1);
      // Respawn gem(s) — occasionally spawn 2
      gems.push(spawnGem());
      if(Math.random()<0.25) gems.push(spawnGem());
      updateUI();
    } else {
      snake.pop();
    }
  }

  gameLoop = requestAnimationFrame(gameStep);
}

function startGame(){
  initGame();
  document.getElementById('overlay').classList.add('hidden');
  particles=[];
  lastTime=0; accum=0;
  gameLoop = requestAnimationFrame(gameStep);
}

function endGame(){
  running=false;
  cancelAnimationFrame(gameLoop);
  if(score>best){
    best=score;
    localStorage.setItem('snapy_best', best);
  }
  // Update leaderboard
  leaderboard.push({name:'YOU', pts:score, date:new Date().toLocaleDateString()});
  leaderboard.sort((a,b)=>b.pts-a.pts);
  leaderboard = leaderboard.slice(0,8);
  localStorage.setItem('snapy_lb', JSON.stringify(leaderboard));
  renderLeaderboard();

  const overlay = document.getElementById('overlay');
  document.getElementById('overlay-title').textContent='GAME OVER';
  document.getElementById('overlay-title').className='overlay-title game-over';
  document.getElementById('overlay-score').textContent = 'Score: '+score+' | Length: '+snake.length;
  document.getElementById('startBtn').textContent='PLAY AGAIN';
  overlay.classList.remove('hidden');
  updateUI();
}

function renderLeaderboard(){
  const lb = document.getElementById('leaderboard');
  const medals=['🥇','🥈','🥉'];
  lb.innerHTML = leaderboard.length === 0
    ? '<div style="color:#2a5a7c;font-size:0.7rem;text-align:center;padding:10px">No scores yet</div>'
    : leaderboard.map((e,i)=>`
      <div class="score-entry">
        <span class="rank">${medals[i]||'#'+(i+1)}</span>
        <span class="score-name">${e.name}</span>
        <span class="score-pts">${e.pts}</span>
      </div>`).join('');
}

// Controls
document.addEventListener('keydown',e=>{
  const map={
    ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},
    ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
    w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0},
    W:{x:0,y:-1},S:{x:0,y:1},A:{x:-1,y:0},D:{x:1,y:0},
  };
  const n=map[e.key];
  if(n && running){
    // Prevent reversing
    if(n.x===-dir.x&&n.y===-dir.y) return;
    nextDir=n;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  }
});

// Mobile swipe
let touchStart=null;
canvas.addEventListener('touchstart',e=>{touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!touchStart||!running) return;
  const dx=e.changedTouches[0].clientX-touchStart.x;
  const dy=e.changedTouches[0].clientY-touchStart.y;
  if(Math.abs(dx)>Math.abs(dy)){
    const n=dx>0?{x:1,y:0}:{x:-1,y:0};
    if(!(n.x===-dir.x&&n.y===-dir.y)) nextDir=n;
  } else {
    const n=dy>0?{x:0,y:1}:{x:0,y:-1};
    if(!(n.x===-dir.x&&n.y===-dir.y)) nextDir=n;
  }
},{passive:true});

document.getElementById('startBtn').addEventListener('click', startGame);

// Init display
document.getElementById('best').textContent = best;
renderLeaderboard();

// Draw idle screen
drawBg();
drawGrid();
ctx.save();
ctx.font=`bold 18px Orbitron, monospace`;
ctx.fillStyle='rgba(0,229,255,0.15)';
ctx.textAlign='center';
ctx.fillText('Press START to play',canvas.width/2,canvas.height/2+60);
ctx.restore();
</script>
</body>
</html>
